name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall src
      - run: pytest
      - run: ruff check src tests scripts

  windows-desktop-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[desktop,geospatial,reporting,dev]"
      - run: >-
          python -m pytest
          tests/test_tiled_geotiff.py
          tests/test_viewer_tools.py
          tests/test_measurements.py
          tests/test_orthomosaic_native.py
          tests/test_universal_pipeline.py
          tests/test_ai_enrichment.py
          tests/test_ollama_provider.py
          tests/test_cli_universal.py
          tests/test_autopilot.py
          tests/test_model_router.py
          tests/test_runtime_monitor.py
          tests/test_frontier_workspace.py
          tests/test_one_click_workspace.py
          tests/test_demo_mission.py
          tests/test_demo_workspace.py
          tests/test_frontier_responsive_workspace.py
      - run: python scripts/smoke_workspace.py
      - run: python scripts/capture_workspace_qa.py --output-dir build/ui-qa
      - uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-visual-qa
          path: build/ui-qa/*.png
          if-no-files-found: error
