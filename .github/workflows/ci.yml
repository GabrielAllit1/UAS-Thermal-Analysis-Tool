name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall src
      - run: pytest
      - run: ruff check src tests scripts

  windows-desktop-smoke:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e ".[desktop,geospatial,reporting,dev]"
      - run: python -m pytest tests/test_tiled_geotiff.py tests/test_viewer_tools.py
      - run: python scripts/smoke_workspace.py
      - run: python scripts/capture_workspace_qa.py --output-dir build/ui-qa
      - uses: actions/upload-artifact@v4
        with:
          name: windows-workspace-visual-qa
          path: build/ui-qa/*.png
          if-no-files-found: error
