name: Bug report
description: Report a reproducible problem in UAS Thermal Analysis
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source format / sensor
      placeholder: GeoTIFF, DJI R-JPEG, etc.
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
