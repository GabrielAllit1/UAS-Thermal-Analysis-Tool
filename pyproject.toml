[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uas-thermal-analysis"
version = "0.3.1"
description = "Vendor-neutral thermal inspection and geospatial analytics platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "SALT19"}]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
desktop = ["PyQt5>=5.15"]
geospatial = ["rasterio>=1.3", "pyproj>=3.6"]
vision = ["opencv-python>=4.9", "scikit-image>=0.22", "exifread>=3.0"]
reporting = ["reportlab>=4.0"]
dji = ["opencv-python>=4.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
  "PyQt5>=5.15",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "opencv-python>=4.9",
  "scikit-image>=0.22",
  "exifread>=3.0",
  "reportlab>=4.0",
]

[project.scripts]
uas-thermal = "uas_thermal.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "RUF"]
